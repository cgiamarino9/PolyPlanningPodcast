<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Poly Planning Podcast</title>

    <!-- Stratos Adobe Font Kit -->
    <link rel="stylesheet" href="https://use.typekit.net/xmn0yeq.css">

    <style>
         :root {
            --green: #184638;
            --cream: #f7f5ee;
            --coral: #e98b6c;
            --muted: #56645a;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--cream);
            color: #26332a;
            font-family: "stratos", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            padding: 1.35rem clamp(1.25rem, 6vw, 5.5rem);
            border-bottom: 1px solid #dce1d8;
            color: var(--green);
            font-size: .85rem;
            font-weight: 600;
            letter-spacing: .13em;
            text-transform: uppercase;
        }
        
        main {
            flex: 1;
            width: min(1160px, 100%);
            margin: auto;
            padding: clamp(3.5rem, 9vh, 7rem) clamp(1.5rem, 7vw, 6rem);
            display: grid;
            grid-template-columns: 1.15fr .85fr;
            align-items: center;
            gap: clamp(2rem, 7vw, 7rem);
        }
        
        .eyebrow {
            margin: 0 0 1.15rem;
            color: #547765;
            font-size: .76rem;
            font-weight: 600;
            letter-spacing: .19em;
            text-transform: uppercase;
        }
        
        h1 {
            max-width: 680px;
            margin: 0;
            color: var(--green);
            font-family: "stratos", sans-serif;
            font-size: clamp(3.2rem, 8vw, 6.8rem);
            font-weight: 600;
            line-height: .98;
            letter-spacing: -.03em;
        }
        
        h1 span {
            color: var(--coral);
        }
        
        .description {
            max-width: 580px;
            margin: 1.8rem 0 0;
            color: #46534a;
            font-size: clamp(1.05rem, 1.7vw, 1.28rem);
            line-height: 1.75;
        }
        
        .departments {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;
            margin-top: 1.8rem;
        }
        
        .departments span {
            padding: .55rem .85rem;
            border: 1px solid #c5d2c6;
            border-radius: 99px;
            color: var(--green);
            font-size: .76rem;
            font-weight: 600;
            letter-spacing: .09em;
        }
        
        .logo-frame {
            position: relative;
            min-height: 340px;
            padding: 2rem;
            display: grid;
            place-items: center;
        }
        
        .logo {
            position: relative;
            width: min(100%, 300px);
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 50%;
        }
        
        footer {
            padding: 1.25rem clamp(1.25rem, 6vw, 5.5rem);
            border-top: 1px solid #dce1d8;
            color: #657067;
            font-size: .78rem;
        }
        
        @media (max-width: 720px) {
            main {
                grid-template-columns: 1fr;
                gap: 2.5rem;
                padding-top: 3.5rem;
            }
            .logo-frame {
                min-height: 280px;
                max-width: 430px;
                width: 100%;
                justify-self: center;
            }
            .logo {
                max-height: 240px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header>Poly Planning Podcast</header>
        <main>
            <section aria-labelledby="welcome-title">
                <p class="eyebrow">Scrutinize · Speculate · Spatialize</p>
                <h1 id="welcome-title">Planning a more just <span>future.</span></h1>
                <p class="description">Learning by podcasting. A repository for planners’ ideas and actions in pursuit of social-spatial justice. Planner interviews by MURP students.</p>
                <div class="departments" aria-label="Programs"><span>URP</span><span>ENV</span><span>CPP</span></div>
            </section>
            <div class="logo-frame">
                <img class="logo" src="img/ppp.jpg" alt="Poly Planning Podcast logo">
            </div>
        </main>
        <footer>Conversations for social-spatial justice</footer>
    </div>
</body>

</html>
